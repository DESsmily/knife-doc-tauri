[package]
name = "knife-doc"
version = "0.0.7"
description = "Knife4j 风格的接口文档与快捷请求桌面客户端"
authors = ["knife-doc"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "knife_doc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-better-cors-fetch = "1.8"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
